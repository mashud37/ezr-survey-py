[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ezrsurvey"
version = "0.7.0"
description = "Single-line helpers for consumer survey analysis: the Python port of the R package ezrsurvey."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andreas Schellewald", email = "aschellewald@acm.org" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotnine>=0.13",
    "pyyaml>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
drivers = ["scikit-learn>=1.3"]
excel = ["xlsxwriter>=3.0"]
reports = ["python-pptx>=0.6.21", "python-docx>=1.0"]
quotes = ["squarify>=0.4"]
repel = ["adjustText>=1.0"]
all = [
    "scikit-learn>=1.3",
    "xlsxwriter>=3.0",
    "python-pptx>=0.6.21",
    "python-docx>=1.0",
    "squarify>=0.4",
    "adjustText>=1.0",
]
test = ["pytest>=7"]

[project.urls]
"R original" = "https://github.com/mashud37/ezr-research/tree/main/ezr-survey"

[tool.hatch.build.targets.sdist]
include = ["ezrsurvey", "tests", "README.md", "NEWS.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["ezrsurvey"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]
