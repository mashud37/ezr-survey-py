project:
  type: website
  output-dir: _site

website:
  title: ezrsurvey
  description: Survey analysis helpers for pandas, ported from the R package ezrsurvey.
  site-url: https://mashud37.github.io/ezr-survey-py/
  repo-url: https://github.com/mashud37/ezr-survey-py
  navbar:
    right:
      - icon: github
        href: https://github.com/mashud37/ezr-survey-py
    left:
      - href: articles/get-started.qmd
        text: Get started
      - href: reference/index.qmd
        text: Reference
      - href: datasets.qmd
        text: Datasets
      - text: Articles
        menu:
          - articles/banner-tables.qmd
          - articles/countries-and-currency.qmd
          - articles/powerpoint-decks.qmd
          - articles/quarto-reports.qmd

format:
  html:
    theme: cosmo
    toc: true

# The reference sections are ezrsurvey/families.py without its data family, which datasets.qmd
# covers; tests/test_docs.py checks the two agree.
quartodoc:
  package: ezrsurvey
  parser: numpy
  title: Reference
  sections:
    - title: "Import data"
      desc: "Load and shape raw survey exports."
      contents:
        - parse_filename
        - read_folder
        - select_prefix
        - select_suffix
    - title: "Select columns"
      desc: "The Python form of the tidyselect helpers R users pass to ezrsurvey."
      contents:
        - all_of
        - any_of
        - contains
        - ends_with
        - everything
        - is_numeric
        - starts_with
        - where
    - title: "Clean & recode"
      desc: "Turn messy survey columns into tidy, analysis-ready variables."
      contents:
        - add_region
        - bin_numeric
        - clean_label
        - drop_items
        - ensure_numeric
        - generation_scheme
        - na_blank
        - nps_group
        - recode_age
        - recode_generation
        - recode_likert
        - recode_region
        - recode_subregion
        - split_multi
    - title: "Summarise"
      desc: "Percentages, summaries and cross-tabulations in one line."
      contents:
        - calc_percentage
        - calc_percentage_batch
        - calc_percentage_multi
        - calc_summary
        - clear_checkpoints
        - crosstab
        - crosstab_banner
    - title: "Weighting"
      desc: "Post-stratification / raking applied automatically to the summaries."
      contents:
        - clear_weights
        - clear_weights_cache
        - get_weights
        - has_weights
        - set_weights
        - weight_vector
    - title: "Model"
      desc: "NPS and importance/performance modelling."
      contents:
        - calc_importance
        - calc_nps
        - ipm_model
    - title: "Compare"
      desc: "Differences between events, waves or segments."
      contents:
        - compare_values
        - plot_diff
    - title: "Diagnostics"
      desc: "Sampling precision and standard errors."
      contents:
        - diagnose
        - margin_of_error
        - precision_summary
        - rse
        - rse_rating
        - se_mean
        - se_prop
    - title: "Comments"
      desc: "Select illustrative open-text comments."
